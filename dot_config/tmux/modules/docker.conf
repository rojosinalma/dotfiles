# vim:set ft=tmux:
# Custom catppuccin status module: number of running Docker containers.
%hidden MODULE_NAME="docker"

set -ogq "@catppuccin_${MODULE_NAME}_icon" "󰡨 "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_sapphire}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #{l:#(docker ps -q 2>/dev/null | wc -l)}"

source -F "~/.config/tmux/plugins/catppuccin/tmux/utils/status_module.conf"
